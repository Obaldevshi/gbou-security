<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Система управления безопасным выходом учащихся.">
  <meta name="theme-color" content="#07111F">
  <link rel="preconnect" href="https://obaldevshi-gbou-security-ac8a.twc1.net" crossorigin>
  <link rel="dns-prefetch" href="//obaldevshi-gbou-security-ac8a.twc1.net">
  <link rel="preload" href="flutter_bootstrap.js?v=1.1.0-3" as="script">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Безопасность ГБОУ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Безопасность ГБОУ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="loading-mark" aria-hidden="true">✓</div>
    <strong>Безопасность ГБОУ</strong>
    <span>Подготавливаем защищённый вход…</span>
    <div class="loading-line"><i></i></div>
  </div>
  <style>
    html, body { margin: 0; min-height: 100%; background: #07111f; }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 24px; box-sizing: border-box; color: #f8fafc;
      font: 16px system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #07111f;
    }
    #app-loading strong { font-size: 24px; letter-spacing: .2px; }
    #app-loading span { color: #b8c4d4; text-align: center; }
    .loading-mark {
      display: grid; place-items: center; width: 68px; height: 68px;
      border-radius: 22px; color: #07111f; background: #5eead4;
      font-size: 34px; font-weight: 800;
    }
    .loading-line { width: min(280px, 72vw); height: 4px; overflow: hidden;
      border-radius: 999px; background: #17263a; }
    .loading-line i { display: block; width: 42%; height: 100%;
      border-radius: inherit; background: #5eead4;
      animation: loading 1.2s ease-in-out infinite alternate; }
    @keyframes loading { from { transform: translateX(-10%); }
      to { transform: translateX(150%); } }
    @media (prefers-reduced-motion: reduce) { .loading-line i { animation: none; } }
  </style>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=1.1.0-3" async></script>
</body>
</html>
