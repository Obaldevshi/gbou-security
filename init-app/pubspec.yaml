name: mobile_template
description: "GBOU Security — учёт выхода учащихся для сотрудников образовательных организаций."
publish_to: "none"
version: 1.8.1+15

environment:
  sdk: ^3.9.2

dependencies:
  go_router: ^16.2.0
  connectivity_plus: ^6.1.4
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^9.2.4
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.17
  fpdart: ^1.1.1
  get_it: ^8.2.0
  injectable: ^2.5.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.0
  retrofit: ^4.7.2
  shared_preferences: ^2.5.3
  file_picker: ^11.0.3
  mobile_scanner: 7.4.2
  excel: ^4.0.6
dev_dependencies:
  integration_test:
    sdk: flutter
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.8.1
  json_serializable: ^6.11.1
  retrofit_generator: ^10.0.5

flutter_gen:
  output: lib/generated/
  line_length: 80
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/licenses/
    - assets/privacy/
    - assets/env/.env
    - assets/env/.env.example

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Medium.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#2367A3"
    theme_color: "#2367A3"
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#2367A3"
  adaptive_icon_foreground: assets/images/app_icon.png
